version: '3'

services:
  app_auth:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: pre
      SPRING_DATASOURCE_URL: jdbc:mysql://auth_db:3306/auth?createDatabaseIfNotExist=true&serverTimezone=UTC
    restart: always
    depends_on:
      auth_db:
        condition: service_healthy

  auth_db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: josedabh
      MYSQL_PASSWORD: OMEGA03boli+
      MYSQL_DATABASE: auth
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
